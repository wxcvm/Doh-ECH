name: DoH security regression tests

on:
  pull_request:
    paths:
      - '_worker.js'
      - 'tests/**'
      - 'scripts/direct-probe.py'
      - 'scripts/*quota.py'
      - 'scripts/*global-dns-summary.py'
      - 'scripts/benchmark-balanced.mjs'
      - 'scripts/dns-benchmark-status.mjs'
      - '.github/workflows/doh-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Worker JavaScript syntax
        run: node --experimental-default-type=module --check _worker.js
      - name: Run no-network DoH smoke tests
        run: node --experimental-default-type=module tests/smoke.mjs
      - name: Validate Balanced benchmark CLI
        run: node tests/benchmark-cli.mjs
      - name: Validate DNS benchmark response classification
        run: node tests/benchmark-dns-status.mjs
      - name: Validate DNS JSON answer ownership
        run: node tests/json-answer-ownership.mjs
      - name: Test local direct probe
        run: python3 tests/test_direct_probe.py

      - name: Test global DNS summary and daily quota monitoring
        run: |
          python3 scripts/test-global-dns-summary.py
          python3 scripts/test-worker-quota.py
